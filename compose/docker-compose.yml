services:
  nginx:
    image: nginx:1.27-alpine
    container_name: labv1_nginx
    depends_on:
      - tomcat
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - labv1_net
    restart: unless-stopped

  tomcat:
    image: tomcat:9.0-jdk17-temurin
    container_name: labv1_tomcat
    ports:
      - "${TOMCAT_PORT}:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ../tomcat/webapps/labapp.war:/usr/local/tomcat/webapps/labapp.war:ro
    command: >
      sh -c "cp -r /usr/local/tomcat/webapps.dist/* /usr/local/tomcat/webapps/ &&
             catalina.sh run"
    networks:
      - labv1_net
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: labv1_mysql
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - labv1_mysql_data:/var/lib/mysql
      - ../mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - labv1_net
    restart: unless-stopped

volumes:
  labv1_mysql_data:

networks:
  labv1_net:
    driver: bridge